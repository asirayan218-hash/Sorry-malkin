<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Arooma Jee ❤</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000000; 
            font-family: 'Inter', sans-serif;
        }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
        
        /* Background sorry words sirf peeche rahenge */
        .sorry-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-sorry {
            position: absolute;
            color: #ff3366;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.8), 0 0 20px rgba(255, 51, 102, 0.4);
            animation: pulseGlow 3s ease-in-out infinite alternate;
            white-space: nowrap;
            user-select: none;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.25; transform: scale(0.9); }
            100% { opacity: 0.75; transform: scale(1.05); }
        }

        /* Center text ke peeche dark box taake sorry words beech mein na aayein */
        .love-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            background: rgba(0, 0, 0, 0.75);
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
        }

        .love-text.show {
            opacity: 1;
        }

        .love-text h1 {
            color: #ff2a6d;
            font-size: 2.2rem;
            font-weight: 900;
            text-shadow: 0 0 25px rgba(255, 42, 109, 0.9), 0 0 50px rgba(255, 42, 109, 0.5);
            margin: 0;
            letter-spacing: 1.5px;
            animation: pulseText 1.8s ease-in-out infinite alternate;
        }

        .love-text p {
            color: #f3e5ab;
            font-size: 1.2rem;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(243, 229, 171, 0.7);
            margin-top: 10px;
            letter-spacing: 1px;
        }

        @keyframes pulseText {
            0% { transform: scale(1); }
            100% { transform: scale(1.06); }
        }
    </style>
</head>
<body>

    <div class="sorry-bg" id="sorryBgContainer"></div>

    <div class="love-text" id="loveText">
        <h1>I Love You So Much Bubu ❤️</h1>
        <p>Arooma Jee - Sorry</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const bgContainer = document.getElementById('sorryBgContainer');
        const totalSorrys = 65;
        
        for (let i = 0; i < totalSorrys; i++) {
            const span = document.createElement('div');
            span.classList.add('floating-sorry');
            span.innerText = "Sorry";
            
            // Center area (jahan text aur dil hai) ko chor kar baaki jagah sorry lagayenge
            let x = Math.random() * 92;
            let y = Math.random() * 92;
            
            // Agar coordinates center ke kareeb hon toh unhein side par shift kar do
            if (x > 30 && x < 70 && y > 35 && y < 65) {
                x = Math.random() > 0.5 ? Math.random() * 25 : 75 + Math.random() * 20;
            }

            span.style.left = x + 'vw';
            span.style.top = y + 'vh';
            span.style.animationDelay = (Math.random() * 3) + 's';
            span.style.animationDuration = (2 + Math.random() * 3) + 's';
            span.style.fontSize = (0.7 + Math.random() * 1.1) + 'rem';
            span.style.transform = `rotate(${Math.random() * 40 - 20}deg)`;
            bgContainer.appendChild(span);
        }

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const particleCount = 4500;
        const geometry = new THREE.BufferGeometry();
        const positions = [];

        for (let i = 0; i < particleCount; i++) {
            const t = Math.random() * Math.PI * 2;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            const z = (Math.random() - 0.5) * 4;

            positions.push(x * 0.35, y * 0.35, z);
        }

        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

        const material = new THREE.PointsMaterial({
            color: 0xff1493,
            size: 0.1,
            transparent: true,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        camera.position.z = 15;

        setTimeout(() => {
            document.getElementById('loveText').classList.add('show');
        }, 1000);

        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.y += 0.01;
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
